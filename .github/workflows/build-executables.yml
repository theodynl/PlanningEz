name: Build executables

# Builds standalone PlanningEz executables for Windows, macOS and Linux.
# - On a version tag (v*) it attaches the binaries to a GitHub Release.
# - It can also be run manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
    branches:
      - project-start
    paths:
      - "planningez/**"
      - "frontend/**"
      - "PlanningEz.spec"
      - "pyproject.toml"
      - ".github/workflows/build-executables.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: PlanningEz-linux
            binary: dist/PlanningEz
          - os: windows-latest
            artifact: PlanningEz-windows.exe
            binary: dist/PlanningEz.exe
          - os: macos-latest
            artifact: PlanningEz-macos
            binary: dist/PlanningEz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller PlanningEz.spec --noconfirm

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/project-start'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish executables to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: PlanningEz ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
